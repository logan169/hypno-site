<script>
/* Thème (nuit) appliqué AVANT le premier paint — aucun flash. */
(function(){var s=null;try{s=localStorage.getItem('marion-theme')}catch(e){}
var d=s; if(!d){d=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
document.documentElement.setAttribute('data-theme',d);})();
</script>

<style>

</main>

<script>
/* Bascule jour/nuit minimale (cohérente avec le reste du site) */
(function(){
  'use strict';
  var root=document.documentElement;
  var meta=document.querySelector('meta[name="theme-color"]');
  var btn=document.querySelector('.theme-toggle');
  function paint(t){
    root.setAttribute('data-theme',t);
    if(meta) meta.setAttribute('content', t==='dark'?'#302F2B':'#F5F1E9');
    if(btn) btn.setAttribute('aria-pressed', String(t==='dark'));
    var mark=document.querySelector('.err-mark'); if(mark) mark.src='static/'+(t==='dark'?'logo-dark.svg':'logo.svg');
  }
  try{paint(localStorage.getItem('marion-theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'));}catch(e){paint('light');}
  if(btn) btn.addEventListener('click',function(){
    var n=root.getAttribute('data-theme')==='dark'?'light':'dark';
    try{localStorage.setItem('marion-theme',n);}catch(e){}
    paint(n);
  });
})();
</script>
</body>
